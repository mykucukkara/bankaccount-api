spring.application.name=bankaccount-api
server.port=8080

# H2 in-memory veritabanı
spring.datasource.url=jdbc:h2:mem:bankdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 konsolu: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JSON
spring.jackson.serialization.write-dates-as-timestamps=false

# Loglama
logging.level.root=INFO
logging.level.tr.edu.sakarya.bil002=INFO
